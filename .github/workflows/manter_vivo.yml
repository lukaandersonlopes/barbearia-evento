name: Robô Vigia Agressivo
on:
  schedule:
    - cron: "*/12 * * * *" # Roda a cada 12 minutos (segurança máxima)
  workflow_dispatch:

jobs:
  acordar_site:
    runs-on: ubuntu-latest
    steps:
      - name: Acesso Completo (Anti-Cache)
        run: |
          # Gera um número único baseado na hora atual para enganar o cache
          TIMESTAMP=$(date +%s)
          
          # Baixa a página inteira com um parametro falso (?dummy=...)
          # Isso obriga o servidor a processar a requisição do zero
          curl -L --max-time 30 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" "https://barbeariavasques.streamlit.app/?dummy=$TIMESTAMP" || true
          
          echo "Acesso realizado com parametro unico: $TIMESTAMP"
